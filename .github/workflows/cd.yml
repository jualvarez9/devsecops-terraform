name: CD (despliegue contra Floci local)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:4566

jobs:
  deploy:
    name: Apply + smoke test
    # Self-hosted runner registrado en el propio PC (ver README): corre en
    # local para poder hablar con Floci en localhost:4566 (docker-compose),
    # cosa que un runner ubuntu-latest de GitHub no puede hacer.
    runs-on: [self-hosted-floci]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Comprobar que Floci esté listo
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4566/_floci/health > /dev/null; then
              echo "Floci listo"
              exit 0
            fi
            echo "Esperando a Floci ($i)... ¿está arrancado con 'docker compose up -d'?"
            sleep 2
          done
          echo "Floci no respondió a tiempo" >&2
          exit 1

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Smoke test - describe cluster
        run: |
          CLUSTER_NAME=$(terraform -chdir=infra output -raw cluster_name)
          aws eks describe-cluster --name "$CLUSTER_NAME"

      - name: Smoke test - kubectl get nodes
        run: |
          CLUSTER_NAME=$(terraform -chdir=infra output -raw cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME"
          kubectl get nodes
